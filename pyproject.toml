[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vishgym"
version = "0.1.0"
description = "A closed, synthetic multimodal red/blue self-play arena for payment-fraud defense research."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "VishGym contributors"}]
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
app = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "streamlit>=1.39"]
training = ["openenv>=0.4.1", "trl>=0.15", "peft>=0.13", "transformers>=4.57", "accelerate>=1.0", "bitsandbytes>=0.44", "torch>=2.4", "librosa>=0.10"]
audio = ["qwen-tts", "soundfile>=0.12", "torch>=2.4", "torchaudio>=2.4"]
modal = ["modal>=1.0"]
dev = ["pytest>=8.3", "httpx>=0.27", "python-docx>=1.1"]

[project.scripts]
vishgym-demo = "vishgym.cli:main"
vishgym-train = "vishgym.training.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
